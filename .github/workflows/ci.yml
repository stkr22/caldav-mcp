name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a # v7.1.5

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install the project
        run: uv sync --locked --dev

      - name: Ruff
        run: |
          uv run ruff check --output-format=github .
          uv run ruff format --check .

      - name: ty
        run: uv run ty check

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@ed21f2f24f8dd64503750218de024bcf64c7250a # v7.1.5

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install the project
        run: uv sync --locked --dev

      - name: Pytest (unit)
        run: uv run pytest tests/unit --cov=caldav_mcp --cov-report=term

      # The integration suite talks to a real CalDAV server. CALDAV_REQUIRE_INTEGRATION makes an unreachable
      # server a failure instead of a skip, so this step can never pass by quietly testing nothing.
      - name: Start Radicale
        run: |
          ./tests/integration/radicale-local.sh > radicale.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -s -o /dev/null -X PROPFIND -u testuser:testpass http://127.0.0.1:5232/testuser/ && exit 0
            sleep 1
          done
          cat radicale.log
          exit 1

      - name: Pytest (integration)
        env:
          CALDAV_REQUIRE_INTEGRATION: "1"
        run: uv run pytest tests/integration

  container-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3

      - name: Build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: false
