[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "caldav-mcp"
version = "0.2.1"
description = "MCP server for CalDAV calendar integration (read/write events), Streamable HTTP transport"
authors = [
    { name = "stkr22", email = "stkr22@github.com" }
]
readme = "README.md"
requires-python = ">=3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "icalendar>=7.2",
    "caldav>=3.2",
    "fastmcp>=3.4",
    "requests>=2.32",
    "cryptography>=44.0.1",
]

[project.scripts]
caldav-mcp-config = "caldav_mcp.config_cli:main"

[project.urls]
Homepage = "https://github.com/gelse/caldav-mcp"
Issues = "https://github.com/gelse/caldav-mcp/issues"
Documentation = "https://github.com/gelse/caldav-mcp/tree/main/docs"
Repository = "https://github.com/gelse/caldav-mcp"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "ty>=0.0.1a20",
    "pytest>=8.4",
    "pytest-cov>=6",
    "pytest-timeout>=2.4",
    "pytest-benchmark>=5.1",
]
docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]

[tool.uv]
required-version = ">=0.13"

[tool.uv.build-backend]
module-root = ""
module-name = "caldav_mcp"

[tool.ty.rules]
possibly-unresolved-reference = "warn"
unused-ignore-comment = "warn"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "-q"]
testpaths = ["tests"]
pythonpath = ["."]  # server.py is a repo-root entrypoint, not part of the wheel
timeout = 60
markers = [
    "unit: pure unit tests with no external dependencies",
    "integration: tests against a live CalDAV server (Radicale via Docker)",
    "performance: benchmarks and load tests",
    "slow: tests that take more than a few seconds",
]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "N", "B", "C4", "RET", "SIM", "ARG", "PTH", "W", "Q",
    "TID", "ICN", "PIE", "ERA", "PL", "RUF", "ASYNC", "D", "S",
]
ignore = [
    "E203",
    "D203",  # Incompatible with D211
    "D213",  # Incompatible with D212
    "PLR0913",  # MCP tool signatures are their parameter lists
    "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101", "S105", "S106", "S107", "PLR2004", "D", "ARG001", "ARG002"]

[tool.ty.environment]
extra-paths = ["tests"]
