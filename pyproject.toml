[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[project]
name = "caldav-mcp"
version = "0.3.0"
description = "MCP server that gives an LLM agent compact, safe read/write access to a CalDAV calendar over Streamable HTTP"
authors = [
    { name = "stkr22" }
]
readme = "README.md"
requires-python = ">=3.15"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "caldav>=3.7",
    "fastmcp>=4.2",
    "icalendar>=7.3",
    "lxml>=6.0",
    "python-dateutil>=2.9",
    "recurring-ical-events>=3.8",
    "niquests>=3.15",
    "tzdata>=2025.2",
]

[project.scripts]
caldav-mcp = "caldav_mcp.app:main"
caldav-mcp-probe = "caldav_mcp.probe:main"

[project.urls]
Homepage = "https://github.com/stkr22/caldav-mcp"
Issues = "https://github.com/stkr22/caldav-mcp/issues"
Documentation = "https://github.com/stkr22/caldav-mcp/tree/main/docs"
Repository = "https://github.com/stkr22/caldav-mcp"

[dependency-groups]
dev = [
    "ruff>=0.14",
    "ty>=0.0.1a20",
    "pytest>=8.4",
    "pytest-cov>=6",
    "pytest-timeout>=2.4",
]

[tool.uv]
required-version = ">=0.13"

[tool.uv.build-backend]
module-root = ""
module-name = "caldav_mcp"

[tool.ty.rules]
possibly-unresolved-reference = "warn"
unused-ignore-comment = "warn"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "-q"]
testpaths = ["tests"]
pythonpath = ["."]  # tests import shared helpers as `tests.*`
timeout = 60
markers = [
    "unit: pure unit tests with no external dependencies",
    "integration: tests against a live CalDAV server (Radicale; see tests/integration/conftest.py)",
    "slow: tests that take more than a few seconds",
]


[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "N", "B", "C4", "RET", "SIM", "ARG", "PTH", "W", "Q",
    "TID", "ICN", "PIE", "ERA", "PL", "RUF", "ASYNC", "D", "S",
]
ignore = [
    "E203",
    "D203",  # Incompatible with D211
    "D213",  # Incompatible with D212
    "PLR0913",  # MCP tool signatures are their parameter lists
    "PLR0917",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["E501", "S101", "S105", "S106", "S107", "PLR2004", "D", "ARG001", "ARG002"]

[tool.ty.environment]
extra-paths = ["tests"]
